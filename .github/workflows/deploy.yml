name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            codegrow/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Install CodeGrow
        working-directory: codegrow
        run: npm ci

      - name: Test CodeGrow
        working-directory: codegrow
        run: |
          npm test
          npm run test:server

      - name: Build CodeGrow with same-origin C compiler
        working-directory: codegrow
        run: npm run build:site

      - name: Install browser for functional tests
        working-directory: codegrow
        run: npx playwright install --with-deps chromium

      - name: Verify CodeGrow browser workflow
        working-directory: codegrow
        run: |
          npm run test:e2e
          npm run test:database

      - name: Preserve browser diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: codegrow-browser-diagnostics
          path: codegrow/test-results
          if-no-files-found: ignore

      - name: Assemble both websites
        run: cp -R codegrow/dist dist/codegrow

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
